name: Build Gunshot Jailed Debug

on:
  workflow_dispatch:
  push:
    branches:
      - debug/jailed-overlay

permissions:
  contents: read

jobs:
  jailed-debug:
    name: package (jailed debug)
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/.theos-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Install Theos and tools
        run: |
          brew install ldid dpkg
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git -C "$THEOS" submodule update --init --recursive
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          version=$(xcrun --sdk iphoneos --show-sdk-version)
          mkdir -p "$THEOS/sdks"
          ln -s "$sdk" "$THEOS/sdks/iPhoneOS${version}.sdk"

      - name: Build jailed debug package
        run: bash scripts/package.sh jailed

      - name: Verify package layout
        run: python3 scripts/verify-package.py jailed

      - name: Show outputs
        run: |
          find packages/jailed -maxdepth 1 -type f -print
          file packages/jailed/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: gotohp-tweak-jailed-debug
          path: |
            packages/jailed/*.deb
            packages/jailed/*.dylib
            packages/jailed/ThirdPartyNotices.txt
          if-no-files-found: error
